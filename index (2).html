<style>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;

/* ============================================================
   REAL LOCAL BACKEND (server.py) — talks to the actual file
   storage on this computer. All calls use relative URLs because
   server.py serves this very page from http://127.0.0.1:8000.
   ============================================================ */

async function apiHealth(){
  try{
    const res = await fetch('/api/health', {cache:'no-store'});
    if(!res.ok) return false;
    const data = await res.json();
    return !!data.ok;
  }catch(e){
    return false;
  }
}

async function apiUpload(filename, contentType, buffer, checksum){
  const res = await fetch('/api/upload', {
    method:'POST',
    headers:{
      'X-Filename': encodeURIComponent(filename),
      'X-Checksum': checksum,
      'Content-Type': contentType || 'application/octet-stream',
    },
    body: buffer,
  });
  let data = null;
  try{ data = await res.json(); }catch(e){ /* non-JSON error body, ignore */ }
  if(!res.ok){
    const msg = (data && data.error) ? data.error : `Backend upload failed (HTTP ${res.status})`;
    throw new Error(msg);
  }
  if(!data || !data.file) throw new Error('Backend returned an unexpected response');
  return data.file;
}

async function apiDownload(backendId){
  const res = await fetch(`/api/download/${encodeURIComponent(backendId)}`);
  if(!res.ok){
    let msg = `Backend download failed (HTTP ${res.status})`;
    try{ const data = await res.json(); if(data && data.error) msg = data.error; }catch(e){}
    throw new Error(msg);
  }
  return await res.blob();
}

async function apiDeleteFile(backendId){
  const res = await fetch(`/api/files/${encodeURIComponent(backendId)}`, {method:'DELETE'});
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const msg = (data && data.error) ? data.error : `Backend delete failed (HTTP ${res.status})`;
    throw new Error(msg);
  }
  return data;
}

async function apiRenameFile(backendId, newName){
  const res = await fetch(`/api/files/${encodeURIComponent(backendId)}`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({filename:newName}),
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const msg = (data && data.error) ? data.error : `Backend rename failed (HTTP ${res.status})`;
    throw new Error(msg);
  }
  if(!data || !data.file) throw new Error('Backend returned an unexpected response');
  return data.file;
}

/* ============================================================
   INDEXEDDB — the SIMULATED distributed layer only.
   Nodes, replicas, corruption state, activity log and settings
   live here. This is NOT the real backend; the real backend is
   server.py + nsrh_storage/ on disk, reached via the API above.
   ============================================================ */

const DB_NAME='nsrh_hub_db', DB_VERSION=2;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('objects')) db.createObjectStore('objects',{keyPath:'id'});
      if(!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs',{keyPath:'id'});
      if(!db.objectStoreNames.contains('nodes')) db.createObjectStore('nodes',{keyPath:'id'});
      if(!db.objectStoreNames.contains('activity')) db.createObjectStore('activity',{keyPath:'id'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
      if(!db.objectStoreNames.contains('notes')) db.createObjectStore('notes',{keyPath:'id'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function dbGetAll(db,store){
  return new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).getAll();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function dbGet(db,store,key){
  return new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).get(key);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function dbPut(db,store,val){
  return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
}
function dbDelete(db,store,key){
  return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
}
function dbClear(db,store){
  return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).clear();
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
}

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function formatBytes(bytes){
  if(!bytes) return '0 B';
  const units=['B','KB','MB','GB','TB'];
  const i=Math.min(units.length-1, Math.floor(Math.log(bytes)/Math.log(1024)));
  return (bytes/Math.pow(1024,i)).toFixed(i===0?0:2)+' '+units[i];
}
function extOf(name){ const d=name.lastIndexOf('.'); return d>0? name.slice(d+1).toUpperCase(): 'FILE'; }
async function sha256Hex(buffer){
  const hash = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function readFileWithProgress(file,onProgress){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onprogress = (e)=>{ if(e.lengthComputable) onProgress(Math.round(e.loaded/e.total*85)); };
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(reader.error || new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}
const NODE_CAPACITY = 2*1024*1024*1024;

async function seedIfNeeded(db){
  let nodes = await dbGetAll(db,'nodes');
  if(nodes.length===0){
    nodes = ['NSRH Node Alpha','NSRH Node Beta','NSRH Node Gamma','NSRH Node Delta'].map((name,i)=>(
      {id:'node-'+(i+1), name, status:'healthy', usedBytes:0, objectCount:0, capacityBytes:NODE_CAPACITY}));
    for(const n of nodes) await dbPut(db,'nodes',n);
  }
  let settings = await dbGet(db,'settings','config');
  if(!settings){
    settings = {key:'config', replicationFactor:3, namingPolicy:'reject'};
    await dbPut(db,'settings',settings);
  }
  let activity = await dbGetAll(db,'activity');
  if(activity.length===0){
    const entry = {id:uid(), type:'info', msg:'NSRH HUB storage cluster online — 4 nodes active, quorum ready', time:new Date().toLocaleTimeString()};
    await dbPut(db,'activity',entry);
    activity=[entry];
  }
  return {nodes, settings, activity};
}

function App(){
  const dbRef = useRef(null);
  const [ready,setReady] = useState(false);
  const [nodes,setNodes] = useState([]);
  const [objects,setObjects] = useState([]);
  const [settings,setSettings] = useState({replicationFactor:3, namingPolicy:'reject'});
  const [activity,setActivity] = useState([]);
  const [selected,setSelected] = useState(null);
  const [showUpload,setShowUpload] = useState(false);
  const [showLogoModal,setShowLogoModal] = useState(false);
  const [uploading,setUploading] = useState(null);
  const [toasts,setToasts] = useState([]);
  const [activeNav,setActiveNav] = useState('dashboard');
  const [searchText,setSearchText] = useState('');
  const [statusFilter,setStatusFilter] = useState('all');
  const [nodeFilter,setNodeFilter] = useState('all');
  const [sortKey,setSortKey] = useState('createdAt');
  const [sortDir,setSortDir] = useState('desc');
  const [backendStatus,setBackendStatus] = useState('checking'); // 'checking' | 'online' | 'offline'
  const [notes,setNotes] = useState([]);
  const [selectedNoteId,setSelectedNoteId] = useState(null);

  useEffect(()=>{
    (async ()=>{
      const database = await openDB();
      dbRef.current = database;
      const seeded = await seedIfNeeded(database);
      const objs = await dbGetAll(database,'objects');
      const savedNotes = await dbGetAll(database,'notes');
      setNodes(seeded.nodes);
      setSettings(seeded.settings);
      setActivity(seeded.activity);
      setObjects(objs.sort((a,b)=>b.createdAt-a.createdAt));
      const sortedNotes = savedNotes.sort((a,b)=>b.updatedAt-a.updatedAt);
      setNotes(sortedNotes);
      if(sortedNotes.length) setSelectedNoteId(sortedNotes[0].id);
      setReady(true);
    })();
  },[]);

  // Backend connection status: check on load, then poll periodically.
  // Never let a failed health check crash the app.
  useEffect(()=>{
    let cancelled = false;
    async function check(){
      const ok = await apiHealth();
      if(!cancelled) setBackendStatus(ok ? 'online' : 'offline');
    }
    check();
    const interval = setInterval(check, 6000);
    return ()=>{ cancelled = true; clearInterval(interval); };
  },[]);

  const db = () => dbRef.current;
  const nodeName = id => (nodes.find(n=>n.id===id)||{}).name || id;
  const toast = (msg,kind='good') => {
    const id = uid();
    setToasts(t => [...t,{id,msg,kind}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 3400);
  };
  async function addLog(type,msg){
    const entry = {id:uid(), type, msg, time:new Date().toLocaleTimeString()};
    await dbPut(db(),'activity',entry);
    setActivity(a => [entry,...a].slice(0,100));
  }

  const healthyCount = nodes.filter(n=>n.status==='healthy').length;
  const totalObjects = objects.length;
  const totalStorage = nodes.reduce((s,n)=>s+n.usedBytes,0);
  const totalCapacity = nodes.reduce((s,n)=>s+n.capacityBytes,0);
  const systemDegraded = healthyCount < nodes.length || objects.some(o=>o.status!=='healthy');

  async function handleUpload(file){
    if(!file) return;
    if(backendStatus!=='online'){
      toast('Local backend is offline — start server.py before uploading','bad');
      return;
    }
    setUploading({progress:0, phase:'Reading file…'});
    try{
      const buffer = await readFileWithProgress(file, p=>setUploading(u=>u&&({...u,progress:p})));
      setUploading(u=>u&&({...u,phase:'Computing SHA-256 checksum…', progress:87}));
      const checksum = await sha256Hex(buffer);

      let finalName = file.name;
      const exists = objects.some(o=>o.name.toLowerCase()===finalName.toLowerCase());
      if(exists){
        if(settings.namingPolicy==='reject'){
          toast(`An object named "${finalName}" already exists in NSRH HUB`,'bad');
          setUploading(null); return;
        }
        const dot = finalName.lastIndexOf('.');
        const base = dot>0? finalName.slice(0,dot): finalName;
        const ext = dot>0? finalName.slice(dot): '';
        let n=2, candidate;
        do{ candidate = `${base} (${n})${ext}`; n++; } while(objects.some(o=>o.name.toLowerCase()===candidate.toLowerCase()));
        finalName = candidate;
      }

      // ---- REAL backend: send actual bytes to server.py, which
      // independently recalculates SHA-256 and only saves the file
      // to disk if its own hash matches ours. ----
      setUploading(u=>u&&({...u,phase:'Uploading to local backend & verifying…', progress:92}));
      let backendRecord;
      try{
        backendRecord = await apiUpload(finalName, file.type, buffer, checksum);
      }catch(err){
        toast('Backend rejected the upload: '+err.message, 'bad');
        await addLog('bad', `Backend upload of "${finalName}" failed: ${err.message}`);
        setUploading(null);
        return;
      }

      // ---- SIMULATED layer: fan the verified bytes out to healthy
      // simulated nodes in IndexedDB for the distributed-storage demo. ----
      setUploading(u=>u&&({...u,phase:'Backend verified SHA-256 — replicating across nodes…', progress:97}));
      const healthy = [...nodes].filter(n=>n.status==='healthy').sort((a,b)=>a.usedBytes-b.usedBytes);
      if(healthy.length===0){
        toast('File saved on the real backend, but no healthy nodes are available to replicate it','bad');
        await addLog('bad', `"${finalName}" saved on the local backend but could not be replicated — no healthy simulated nodes`);
        setUploading(null); return;
      }
      const factor = settings.replicationFactor;
      const targets = healthy.slice(0, Math.min(factor, healthy.length));

      const id = uid();
      const replicas = [];
      let updatedNodes = [...nodes];
      const replicaBlob = new Blob([buffer], {type:file.type});
      for(const t of targets){
        await dbPut(db(),'blobs',{id:`${id}:${t.id}`, blob:replicaBlob});
        replicas.push({nodeId:t.id, corrupted:false});
        updatedNodes = updatedNodes.map(n => n.id===t.id ? {...n, usedBytes:n.usedBytes+backendRecord.size, objectCount:(n.objectCount||0)+1} : n);
        await dbPut(db(),'nodes', updatedNodes.find(n=>n.id===t.id));
      }
      const record = {
        id, backendId:backendRecord.id, name:finalName, size:backendRecord.size, type:extOf(finalName),
        checksum:backendRecord.checksum, createdAt:Date.now(), updatedAt:Date.now(), replicas,
        status: targets.length>=factor?'healthy':'degraded',
      };
      await dbPut(db(),'objects',record);
      setObjects(o=>[record,...o]);
      setNodes(updatedNodes);
      setSelected(record.id);
      await addLog('good', `Stored ${finalName} (${formatBytes(backendRecord.size)}) on the real local backend — SHA-256: ${backendRecord.checksum.slice(0,12)}… — replicated to ${targets.length} simulated nodes`);
      toast(`${finalName} uploaded to NSRH HUB`,'good');
      setUploading(u=>u&&({...u,progress:100,phase:'Complete'}));
      setTimeout(()=>{ setUploading(null); setShowUpload(false); }, 400);
    }catch(err){
      toast('Upload failed: '+err.message,'bad');
      setUploading(null);
    }
  }

  async function handleDownload(obj){
    if(!obj) return;
    if(!obj.backendId){
      toast(`"${obj.name}" has no real backend record and cannot be downloaded`,'bad');
      return;
    }
    let blob;
    try{
      blob = await apiDownload(obj.backendId);
    }catch(err){
      toast(`Download failed: ${err.message}`,'bad');
      await addLog('bad', `Download of "${obj.name}" from the local backend failed: ${err.message}`);
      return;
    }
    const buffer = await blob.arrayBuffer();
    const actualHash = await sha256Hex(buffer);
    if(actualHash !== obj.checksum){
      toast(`Integrity checksum mismatch for "${obj.name}" — download blocked`,'bad');
      await addLog('bad', `Integrity check FAILED for "${obj.name}" after backend download — checksum mismatch, download blocked`);
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=obj.name; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    await addLog('good', `Downloaded "${obj.name}" from the real local backend — cryptographic checksum verified`);
    toast(`"${obj.name}" downloaded`,'good');
  }

  async function handleDelete(obj){
    if(!confirm(`Delete "${obj.name}" and all ${obj.replicas.length} replicas from NSRH HUB?`)) return;
    if(obj.backendId){
      try{
        await apiDeleteFile(obj.backendId);
      }catch(err){
        toast(`Backend delete failed: ${err.message}`,'bad');
        await addLog('bad', `Failed to delete "${obj.name}" from the local backend: ${err.message}`);
        return;
      }
    }
    let updatedNodes = [...nodes];
    for(const r of obj.replicas){
      await dbDelete(db(),'blobs',`${obj.id}:${r.nodeId}`);
      updatedNodes = updatedNodes.map(n => n.id===r.nodeId ? {...n, usedBytes:Math.max(0,n.usedBytes-obj.size), objectCount:Math.max(0,(n.objectCount||1)-1)} : n);
      const nd = updatedNodes.find(n=>n.id===r.nodeId);
      if(nd) await dbPut(db(),'nodes',nd);
    }
    await dbDelete(db(),'objects',obj.id);
    setObjects(os=>os.filter(o=>o.id!==obj.id));
    setNodes(updatedNodes);
    if(selected===obj.id) setSelected(null);
    await addLog('warn', `Deleted "${obj.name}" from the local backend and cleared ${obj.replicas.length} simulated replicas`);
    toast(`"${obj.name}" removed`,'good');
  }

  async function handleRename(obj,newNameRaw){
    const newName = (newNameRaw||'').trim();
    if(!newName || newName===obj.name) return;
    const exists = objects.some(o=>o.id!==obj.id && o.name.toLowerCase()===newName.toLowerCase());
    if(exists){ toast(`An object named "${newName}" already exists in NSRH HUB`,'bad'); return; }
    let backendName = newName;
    if(obj.backendId){
      try{
        const backendRecord = await apiRenameFile(obj.backendId, newName);
        backendName = backendRecord.filename;
      }catch(err){
        toast(`Backend rename failed: ${err.message}`,'bad');
        await addLog('bad', `Failed to rename "${obj.name}" on the local backend: ${err.message}`);
        return;
      }
    }
    const updated = {...obj, name:backendName, type:extOf(backendName), updatedAt:Date.now()};
    await dbPut(db(),'objects',updated);
    setObjects(os=>os.map(o=>o.id===obj.id?updated:o));
    await addLog('info', `Renamed "${obj.name}" to "${backendName}"`);
    toast('Renamed successfully','good');
  }

  async function handleVerify(obj){
    const goodReplica = obj.replicas.find(r=>!r.corrupted && nodes.find(n=>n.id===r.nodeId && n.status==='healthy'));
    if(!goodReplica){ toast('No healthy replica available to verify','bad'); return; }
    const rec = await dbGet(db(),'blobs',`${obj.id}:${goodReplica.nodeId}`);
    const buf = await rec.blob.arrayBuffer();
    const hash = await sha256Hex(buf);
    const ok = hash===obj.checksum;
    await addLog(ok?'good':'bad', `Integrity check ${ok?'PASSED (Valid)':'FAILED (Corrupt)'} for "${obj.name}" on ${nodeName(goodReplica.nodeId)}`);
    toast(ok?'SHA-256 match verified':'Integrity mismatch detected', ok?'good':'bad');
  }

  async function handleCorruptReplica(obj,nodeId){
    const key = `${obj.id}:${nodeId}`;
    const rec = await dbGet(db(),'blobs',key);
    if(!rec){ toast('Replica not found','bad'); return; }
    const buf = await rec.blob.arrayBuffer();
    if(buf.byteLength===0){ toast('Cannot corrupt an empty file','bad'); return; }
    const bytes = new Uint8Array(buf.slice(0));
    bytes[0] = bytes[0] ^ 0xFF;
    const corruptedBlob = new Blob([bytes], {type: rec.blob.type});
    await dbPut(db(),'blobs',{id:key, blob:corruptedBlob});
    const newHash = await sha256Hex(await corruptedBlob.arrayBuffer());
    const updatedObj = {...obj, replicas: obj.replicas.map(r=>r.nodeId===nodeId?{...r,corrupted:true}:r), status:'degraded'};
    await dbPut(db(),'objects',updatedObj);
    setObjects(os=>os.map(o=>o.id===obj.id?updatedObj:o));
    await addLog('bad', `Silent bit-rot injected on "${obj.name}" at ${nodeName(nodeId)} (hash: ${newHash.slice(0,8)}… vs ${obj.checksum.slice(0,8)}…). The real backend file on disk was not touched.`);
    toast(`Bit-rot simulated on ${nodeName(nodeId)} replica`,'bad');
  }

  async function handleRepairObject(obj){
    const corrupted = obj.replicas.filter(r=>r.corrupted);
    const good = obj.replicas.find(r=>!r.corrupted && nodes.find(n=>n.id===r.nodeId && n.status==='healthy'));
    if(corrupted.length===0){ toast('No corrupted replicas found to repair','info'); return; }
    if(!good){ toast('No healthy replica available to heal from — quorum lost','bad'); return; }
    const goodRec = await dbGet(db(),'blobs',`${obj.id}:${good.nodeId}`);
    for(const r of corrupted){ await dbPut(db(),'blobs',{id:`${obj.id}:${r.nodeId}`, blob:goodRec.blob}); }
    const buf = await goodRec.blob.arrayBuffer();
    const hash = await sha256Hex(buf);
    const updatedObj = {...obj, replicas: obj.replicas.map(r=>({...r,corrupted:false})), status: hash===obj.checksum?'healthy':'degraded'};
    await dbPut(db(),'objects',updatedObj);
    setObjects(os=>os.map(o=>o.id===obj.id?updatedObj:o));
    await addLog('good', `Healed ${corrupted.length} replica(s) of "${obj.name}" using healthy copy from ${nodeName(good.nodeId)}`);
    toast(`"${obj.name}" repaired and verified`,'good');
  }

  async function handleNodeFailure(nodeId){
    const node = nodes.find(n=>n.id===nodeId);
    if(!node || node.status!=='healthy') return;
    let workingNodes = nodes.map(n=>n.id===nodeId?{...n,status:'failed'}:n);
    setNodes(workingNodes);
    await dbPut(db(),'nodes', workingNodes.find(n=>n.id===nodeId));
    await addLog('bad', `Node failure detected: ${node.name} is OFFLINE! Starting auto-migration…`);
    toast(`${node.name} went offline`,'bad');

    const factor = settings.replicationFactor;
    let workingObjects = [...objects];
    let migrated = 0;
    for(let i=0;i<workingObjects.length;i++){
      const obj = workingObjects[i];
      if(!obj.replicas.some(r=>r.nodeId===nodeId)) continue;
      const healthyCountForObj = obj.replicas.filter(r=>{
        const n = workingNodes.find(x=>x.id===r.nodeId);
        return n && n.status==='healthy' && !r.corrupted;
      }).length;
      if(healthyCountForObj >= factor) continue;
      const candidate = workingNodes.filter(n=>n.status==='healthy' && !obj.replicas.some(r=>r.nodeId===n.id))
        .sort((a,b)=>a.usedBytes-b.usedBytes)[0];
      const source = obj.replicas.find(r=>{
        const n = workingNodes.find(x=>x.id===r.nodeId);
        return n && n.status==='healthy' && !r.corrupted;
      });
      if(!candidate || !source){ workingObjects[i] = {...obj, status:'degraded'}; continue; }
      const srcRec = await dbGet(db(),'blobs',`${obj.id}:${source.nodeId}`);
      await dbPut(db(),'blobs',{id:`${obj.id}:${candidate.id}`, blob:srcRec.blob});
      const newReplicas = [...obj.replicas.filter(r=>r.nodeId!==nodeId), {nodeId:candidate.id, corrupted:false}];
      workingObjects[i] = {...obj, replicas:newReplicas, status:'healthy'};
      workingNodes = workingNodes.map(n=>n.id===candidate.id?{...n,usedBytes:n.usedBytes+obj.size,objectCount:(n.objectCount||0)+1}:n);
      await dbPut(db(),'nodes', workingNodes.find(n=>n.id===candidate.id));
      await dbPut(db(),'objects', workingObjects[i]);
      migrated++;
    }
    setObjects(workingObjects);
    setNodes(workingNodes);
    if(migrated>0) await addLog('warn', `Re-replicated ${migrated} object(s) onto healthy NSRH nodes`);
  }

  async function handleNodeRepair(nodeId){
    const node = nodes.find(n=>n.id===nodeId);
    if(!node || node.status!=='failed') return;
    const updated = {...node, status:'healthy'};
    await dbPut(db(),'nodes',updated);
    setNodes(ns=>ns.map(n=>n.id===nodeId?updated:n));
    await addLog('good', `${node.name} repaired and rejoined the NSRH HUB cluster`);
    toast(`${node.name} back online`,'good');
  }

  async function updateSettings(patch){
    const updated = {...settings, ...patch};
    await dbPut(db(),'settings',updated);
    setSettings(updated);
    await addLog('info', `Cluster settings updated: ${Object.keys(patch).map(k=>`${k}=${patch[k]}`).join(', ')}`);
  }
  async function clearAllData(){
    if(!confirm('Permanently wipe all NSRH HUB objects, replicas, and activity logs? (Files already saved on the real backend disk will NOT be deleted automatically — remove nsrh_storage/ manually if needed.)')) return;
    for(const s of ['objects','blobs','nodes','activity']) await dbClear(db(),s);
    const seeded = await seedIfNeeded(db());
    setNodes(seeded.nodes); setObjects([]); setActivity(seeded.activity); setSelected(null);
    toast('NSRH HUB cluster data reset','good');
  }

  const selectedObj = objects.find(o=>o.id===selected) || null;

  function stripHtml(html){
    const div = document.createElement('div');
    div.innerHTML = html || '';
    return (div.textContent || div.innerText || '').replace(/\s+/g,' ').trim();
  }

  async function createNote(){
    const note = {
      id: uid(), title:'Untitled note', content:'',
      createdAt: Date.now(), updatedAt: Date.now(),
    };
    await dbPut(db(),'notes',note);
    setNotes(n => [note, ...n]);
    setSelectedNoteId(note.id);
    setActiveNav('notes');
  }

  async function saveNote(id, patch){
    const existing = notes.find(n=>n.id===id);
    if(!existing) return;
    const updated = {...existing, ...patch, updatedAt: Date.now()};
    await dbPut(db(),'notes',updated);
    setNotes(ns => {
      const next = ns.map(n => n.id===id ? updated : n);
      next.sort((a,b)=>b.updatedAt-a.updatedAt);
      return next;
    });
  }

  async function deleteNote(id){
    const note = notes.find(n=>n.id===id);
    if(!note) return;
    if(!confirm(`Delete "${note.title || 'Untitled note'}"? This cannot be undone.`)) return;
    await dbDelete(db(),'notes',id);
    setNotes(ns => ns.filter(n=>n.id!==id));
    if(selectedNoteId===id){
      const remaining = notes.filter(n=>n.id!==id);
      setSelectedNoteId(remaining.length ? remaining[0].id : null);
    }
    toast('Note deleted','good');
  }

  const selectedNote = notes.find(n=>n.id===selectedNoteId) || null;

  function visibleObjects(){
    let list = objects.filter(o=>{
      if(statusFilter!=='all' && o.status!==statusFilter) return false;
      if(nodeFilter!=='all' && !o.replicas.some(r=>r.nodeId===nodeFilter)) return false;
      if(searchText.trim()){
        const q = searchText.toLowerCase();
        if(![o.name,o.type,o.checksum,o.status].some(v=>String(v).toLowerCase().includes(q))) return false;
      }
      return true;
    });
    list = [...list].sort((a,b)=>{
      let av,bv;
      if(sortKey==='size'){ av=a.size; bv=b.size; }
      else if(sortKey==='replicas'){ av=a.replicas.length; bv=b.replicas.length; }
      else if(sortKey==='createdAt'){ av=a.createdAt; bv=b.createdAt; }
      else if(sortKey==='type'){ av=a.type; bv=b.type; }
      else if(sortKey==='status'){ av=a.status; bv=b.status; }
      else { av=a.name.toLowerCase(); bv=b.name.toLowerCase(); }
      if(av<bv) return sortDir==='asc'?-1:1;
      if(av>bv) return sortDir==='asc'?1:-1;
      return 0;
    });
    return list;
  }
  function toggleSort(key){
    if(sortKey===key) setSortDir(d=>d==='asc'?'desc':'asc');
    else { setSortKey(key); setSortDir('asc'); }
  }
  function sortArrow(key){ return sortKey===key ? (sortDir==='asc'?' ▲':' ▼') : ''; }

  const navItems = [
    ['dashboard','Dashboard'],['objects','Objects & Files'],['nodes','Storage Nodes'],
    ['replication','Replication'],['notes','Notes'],['logs','Activity Logs'],['settings','Settings'],
  ];
  const scrollTo = (key) => {
    setActiveNav(key);
    const map = {dashboard:'overview', objects:'objects', nodes:'nodes', replication:'replication', notes:'notes', logs:'logs', settings:'settings'};
    const el = document.getElementById(map[key]);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  };

  if(!ready){
    return <div className="loading-screen">Opening NSRH HUB cluster database…</div>;
  }

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="logo-container" onClick={()=>setShowLogoModal(true)} title="Click to view brand emblem">
          <NsrhLogoSvg size={38}/>
          <div className="logo-brand">
            <div className="logo-title">
              <span className="blue">NSRH</span> <span className="white">HUB</span>
            </div>
            <div className="logo-sub">Distributed Storage</div>
          </div>
        </div>

        <nav className="nav">
          {navItems.map(([key,label]) => (
            <button key={key} className={"nav-item"+(activeNav===key?' active':'')} onClick={()=>scrollTo(key)}>
              <Icon name={key}/>{label}
            </button>
          ))}
        </nav>

        <div style={{marginTop:'auto',paddingTop:14,borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={()=>setShowLogoModal(true)}>
            View Brand Logo
          </button>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div className="topbar-titles">
            <h1><span style={{color:'#0062FF'}}>NSRH</span> HUB Storage</h1>
            <p>Cryptographically verified multi-node storage with automatic replica balancing</p>
          </div>
          <div className="status-stack">
            <div className="status-pill" title={backendStatus==='online' ? 'server.py is reachable and healthy' : backendStatus==='checking' ? 'Contacting server.py…' : 'server.py is not reachable — start it and refresh'}>
              <span className={"dot "+(backendStatus==='online'?'dot-good':backendStatus==='checking'?'dot-warn':'dot-bad')}></span>
              {backendStatus==='online' ? 'Local backend connected' : backendStatus==='checking' ? 'Checking backend…' : 'Backend offline'}
            </div>
            <div className="status-pill">
              <span className={"dot "+(systemDegraded?'dot-warn':'dot-good')}></span>
              {systemDegraded ? 'Cluster Degraded' : 'Cluster Operational'}
            </div>
          </div>
        </div>

        <section className="section" id="overview">
          <div className="cards-4">
            <div className="card">
              <span className="card-label">Total Objects</span>
              <span className="card-value">{totalObjects}</span>
              <span className="card-foot">stored across NSRH HUB</span>
            </div>
            <div className="card">
              <span className="card-label">Storage Used</span>
              <span className="card-value">{formatBytes(totalStorage)}</span>
              <span className="card-foot">of {formatBytes(totalCapacity)} cluster pool</span>
            </div>
            <div className="card">
              <span className="card-label">Replication Factor</span>
              <span className="card-value">{settings.replicationFactor}×</span>
              <span className="card-foot">copies per object</span>
            </div>
            <div className="card">
              <span className="card-label">Healthy Nodes</span>
              <span className="card-value">{healthyCount} / {nodes.length}</span>
              <span className={"card-foot"+(!systemDegraded?' good':'')}>{systemDegraded?'node attention required':'full cluster quorum'}</span>
            </div>
          </div>
        </section>

        <section className="section">
          <div className="section-head"><h2>Quick Actions</h2></div>
          <div className="actions-row">
            <button className="btn btn-brand" onClick={()=>setShowUpload(true)}><Icon name="upload"/>Upload Object</button>
            <button className="btn btn-ghost" onClick={()=>selectedObj ? handleDownload(selectedObj) : toast('Select an object from the table first','info')}><Icon name="download"/>Download Object</button>
            <button className="btn btn-ghost" onClick={()=>scrollTo('objects')}>Inspect Objects</button>
            <button className="btn btn-warn" onClick={()=>{
              const h = [...nodes].filter(n=>n.status==='healthy').sort((a,b)=>a.usedBytes-b.usedBytes);
              if(h.length) handleNodeFailure(h[0].id); else toast('No healthy nodes left to fail','info');
            }}>Simulate Node Failure</button>
          </div>
        </section>

        <section className="section" id="nodes">
          <div className="section-head">
            <h2>NSRH Storage Nodes</h2>
            <span className="section-sub">{healthyCount}/{nodes.length} online</span>
          </div>
          <div className="nodes-grid">
            {nodes.map(n=>(
              <div key={n.id} className={"node"+(n.status==='failed'?' failed':'')}>
                <div className="node-top">
                  <span className="node-name">{n.name}</span>
                  <span className={"badge "+(n.status==='healthy'?'badge-good':'badge-bad')}>
                    {n.status==='healthy'?'Online':'Offline'}
                  </span>
                </div>
                <div className="bar-track"><div className="bar-fill" style={{width:Math.min(100,n.usedBytes/n.capacityBytes*100)+'%', background: n.status==='failed'?'var(--bad)':'#0062FF'}}></div></div>
                <div className="node-meta">
                  <span>{formatBytes(n.usedBytes)}</span>
                  <span>{n.objectCount||0} replicas</span>
                </div>
                {n.status==='healthy' ? (
                  <button className="btn btn-bad btn-sm" onClick={()=>handleNodeFailure(n.id)}>Simulate Failure</button>
                ) : (
                  <button className="btn btn-good btn-sm" onClick={()=>handleNodeRepair(n.id)}>Repair Node</button>
                )}
              </div>
            ))}
          </div>
        </section>

        <section className="section" id="objects">
          <div className="split">
            <div className="panel">
              <div className="section-head">
                <h2>Stored Objects</h2>
                <span className="section-sub">click a row to inspect replicas</span>
              </div>
              <div className="toolbar">
                <input type="text" placeholder="Search by name, type, checksum…" value={searchText} onChange={e=>setSearchText(e.target.value)} style={{minWidth:220}}/>
                <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
                  <option value="all">All statuses</option>
                  <option value="healthy">Healthy</option>
                  <option value="degraded">Degraded</option>
                </select>
                <select value={nodeFilter} onChange={e=>setNodeFilter(e.target.value)}>
                  <option value="all">All nodes</option>
                  {nodes.map(n=><option key={n.id} value={n.id}>{n.name}</option>)}
                </select>
              </div>
              <div style={{overflowX:'auto'}}>
              <table>
                <thead>
                  <tr>
                    <th className="sortable" onClick={()=>toggleSort('name')}>Name{sortArrow('name')}</th>
                    <th className="sortable" onClick={()=>toggleSort('size')}>Size{sortArrow('size')}</th>
                    <th className="sortable" onClick={()=>toggleSort('type')}>Type{sortArrow('type')}</th>
                    <th className="sortable" onClick={()=>toggleSort('replicas')}>Replicas{sortArrow('replicas')}</th>
                    <th className="sortable" onClick={()=>toggleSort('status')}>Status{sortArrow('status')}</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {visibleObjects().length===0 && (
                    <tr><td colSpan="6" style={{textAlign:'center',color:'var(--faint)',padding:'26px 10px'}}>
                      {objects.length===0 ? 'No objects in NSRH HUB yet — upload your first file to get started.' : 'No objects match your search.'}
                    </td></tr>
                  )}
                  {visibleObjects().map(o=>(
                    <tr key={o.id} className={"obj-row"+(selected===o.id?' selected':'')} onClick={()=>setSelected(o.id)}>
                      <td><div className="file-cell"><span className="file-icon">📄</span>{o.name}</div></td>
                      <td className="mono">{formatBytes(o.size)}</td>
                      <td className="mono">{o.type}</td>
                      <td>
                        <div className="replica-chips">
                          {o.replicas.map(r=>(
                            <span key={r.nodeId} className={"chip"+(r.corrupted?' corrupt':'')}>
                              {nodeName(r.nodeId).split(' ')[1] || nodeName(r.nodeId)}
                              {r.corrupted && ' (corrupt)'}
                            </span>
                          ))}
                        </div>
                      </td>
                      <td><span className={"badge "+(o.status==='healthy'?'badge-good':'badge-warn')}>{o.status==='healthy'?'Healthy':'Degraded'}</span></td>
                      <td onClick={e=>e.stopPropagation()}>
                        <button className="btn btn-ghost btn-sm" onClick={()=>handleDownload(o)}>Download</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              </div>
            </div>

            <div className="panel" id="replication">
              <div className="section-head"><h2>Replication & Integrity</h2></div>
              {!selectedObj ? (
                <div className="detail-empty">Select any object in the table to inspect cryptographic SHA-256 integrity, replica nodes, and healing controls.</div>
              ) : (
                <div>
                  <div className="detail-title">{selectedObj.name}</div>
                  <div className="detail-sub">{formatBytes(selectedObj.size)} · {selectedObj.type} · {new Date(selectedObj.createdAt).toLocaleTimeString()}</div>
                  <div className="detail-row"><span>SHA-256 Hash</span><span className="mono" style={{wordBreak:'break-all',textAlign:'right'}}>{selectedObj.checksum.slice(0,18)}…</span></div>
                  <div className="detail-row"><span>Quorum Health</span>
                    <span style={{color: selectedObj.status==='healthy'?'var(--good)':'var(--warn)', fontWeight:600}}>
                      {selectedObj.status==='healthy'?'Healthy (Verified)':'Degraded'}
                    </span>
                  </div>
                  <div className="detail-row"><span>Replica Count</span><span className="mono">{selectedObj.replicas.length} / {settings.replicationFactor}</span></div>
                  <div className="detail-row"><span>Backend ID</span><span className="mono" style={{wordBreak:'break-all',textAlign:'right'}}>{selectedObj.backendId ? selectedObj.backendId.slice(0,14)+'…' : '—'}</span></div>
                  <div className="replica-list">
                    {selectedObj.replicas.map(r=>{
                      const n = nodes.find(x=>x.id===r.nodeId);
                      const nodeDown = n && n.status!=='healthy';
                      return (
                        <div key={r.nodeId} className={"replica-line"+((r.corrupted||nodeDown)?' corrupted':'')}>
                          <span>{n?n.name:r.nodeId}{nodeDown?' (offline)':''}{r.corrupted?' — corrupted':''}</span>
                          {!r.corrupted && !nodeDown ? (
                            <button className="btn btn-ghost btn-sm" onClick={()=>handleCorruptReplica(selectedObj,r.nodeId)}>Corrupt</button>
                          ) : (
                            <span style={{color: r.corrupted?'var(--bad)':'var(--warn)'}}>●</span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                  <div className="actions-row" style={{marginTop:14}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>handleVerify(selectedObj)}>Verify</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{const n=prompt('Rename to:',selectedObj.name); if(n) handleRename(selectedObj,n);}}>Rename</button>
                    <button className="btn btn-good btn-sm" onClick={()=>handleRepairObject(selectedObj)}>Repair</button>
                    <button className="btn btn-bad btn-sm" onClick={()=>handleDelete(selectedObj)}>Delete</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </section>

        <section className="section" id="notes">
          <div className="split notes-split">
            <div className="panel notes-list-panel">
              <div className="section-head">
                <h2>Notes</h2>
                <button className="btn btn-brand btn-sm" onClick={createNote}><Icon name="add"/>New Note</button>
              </div>
              <div className="notes-list">
                {notes.length===0 && (
                  <div className="detail-empty">No notes yet — create your first note to get started.</div>
                )}
                {notes.map(n=>(
                  <div key={n.id} className={"note-item"+(selectedNoteId===n.id?' selected':'')} onClick={()=>setSelectedNoteId(n.id)}>
                    <div className="note-item-top">
                      <span className="note-item-title">{n.title || 'Untitled note'}</span>
                      <button className="note-item-delete" title="Delete note" onClick={e=>{e.stopPropagation(); deleteNote(n.id);}}>×</button>
                    </div>
                    <div className="note-item-preview">{stripHtml(n.content) || 'No additional text'}</div>
                    <div className="note-item-time">{new Date(n.updatedAt).toLocaleString([], {dateStyle:'medium', timeStyle:'short'})}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="panel notes-editor-panel">
              {!selectedNote ? (
                <div className="detail-empty">Select a note, or create a new one, to start writing.</div>
              ) : (
                <NoteEditor key={selectedNote.id} note={selectedNote} onSave={patch=>saveNote(selectedNote.id,patch)}/>
              )}
            </div>
          </div>
        </section>

        <section className="section" id="logs">
          <div className="panel">
            <div className="section-head"><h2>Cluster Activity Log</h2></div>
            <ul className="activity-list">
              {activity.map(a=>(
                <li key={a.id} className="act-item">
                  <span className={"act-dot "+a.type}></span>
                  <div>
                    <div className="act-msg">{a.msg}</div>
                    <span className="act-time">{a.time}</span>
                  </div>
                </li>
              ))}
            </ul>
          </div>
        </section>

        <section className="section" id="settings">
          <div className="panel">
            <div className="section-head"><h2>Cluster Configuration</h2></div>
            <div className="settings-grid">
              <div className="settings-card">
                <div className="field">
                  <label>Replication Factor</label>
                  <select value={settings.replicationFactor} onChange={e=>updateSettings({replicationFactor:Number(e.target.value)})}>
                    <option value={1}>1 Copy</option>
                    <option value={2}>2 Copies</option>
                    <option value={3}>3 Copies (Recommended)</option>
                    <option value={4}>4 Copies</option>
                  </select>
                </div>
                <div className="field" style={{marginBottom:0}}>
                  <label>Duplicate Name Policy</label>
                  <select value={settings.namingPolicy} onChange={e=>updateSettings({namingPolicy:e.target.value})}>
                    <option value="reject">Reject Upload</option>
                    <option value="rename">Auto-Rename (Append counter)</option>
                  </select>
                </div>
              </div>
              <div className="settings-card">
                <div className="card-label" style={{marginBottom:10}}>Danger Zone</div>
                <p style={{fontSize:'12.5px',color:'var(--dim)',margin:'0 0 12px'}}>Wipe all NSRH HUB objects, stored blobs, and reset nodes back to clean initial state.</p>
                <button className="btn btn-bad" onClick={clearAllData}>Reset Cluster Data</button>
              </div>
            </div>
          </div>
        </section>

        <footer>NSRH HUB — Real local backend storage (server.py + nsrh_storage/) with SHA-256 validation, plus an IndexedDB-simulated multi-node distributed layer for the demo.</footer>
      </main>

      {showUpload && <UploadModal onClose={()=>{ if(!uploading) setShowUpload(false); }} onUpload={handleUpload} uploading={uploading} backendOnline={backendStatus==='online'}/>}

      {showLogoModal && (
        <div className="overlay" onClick={()=>setShowLogoModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{textAlign:'center',padding:28}}>
            <NsrhLogoSvg size={90}/>
            <h2 style={{fontSize:24,fontWeight:900,margin:'14px 0 2px',letterSpacing:'-0.02em'}}>
              <span style={{color:'#2F6BFF'}}>NSRH</span> <span style={{color:'var(--text)'}}>HUB</span>
            </h2>
            <div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--dim)',marginBottom:16}}>Distributed Object Storage</div>
            <p style={{fontSize:12.5,color:'var(--dim)',lineHeight:1.5}}>
              High-durability distributed storage architecture featuring multi-node replication, cryptographic SHA-256 data audits, and self-healing quorum recovery.
            </p>
            <div className="modal-actions" style={{justifyContent:'center',marginTop:16}}>
              <button className="btn btn-brand" onClick={()=>setShowLogoModal(false)}>Close Preview</button>
            </div>
          </div>
        </div>
      )}

      <div className="toasts">
        {toasts.map(t=>(<div key={t.id} className={"toast"+(t.kind==='info'?' info':t.kind==='bad'?' bad':'')}>{t.msg}</div>))}
      </div>
    </div>
  );
}

const FONT_OPTIONS = [
  ['Inter','System'],
  ['Playfair Display','Playfair'],
  ['Lora','Lora'],
  ['Quicksand','Quicksand'],
  ['Caveat','Handwriting'],
  ['Courier Prime','Typewriter'],
  ['Comic Neue','Comic'],
];
const SIZE_OPTIONS = [
  ['2','Small'],['3','Normal'],['5','Large'],['6','X-Large'],['7','Huge'],
];

function NoteEditor({note, onSave}){
  const [title,setTitle] = useState(note.title || '');
  const editorRef = useRef(null);
  const pendingPatch = useRef({});
  const saveTimer = useRef(null);

  useEffect(()=>{
    if(editorRef.current) editorRef.current.innerHTML = note.content || '';
  },[]);

  useEffect(()=>{
    return ()=>{
      if(saveTimer.current) clearTimeout(saveTimer.current);
      if(Object.keys(pendingPatch.current).length) onSave(pendingPatch.current);
    };
    // eslint-disable-next-line
  },[]);

  function scheduleSave(patch){
    pendingPatch.current = {...pendingPatch.current, ...patch};
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      onSave(pendingPatch.current);
      pendingPatch.current = {};
    }, 450);
  }

  function handleTitleChange(e){
    const value = e.target.value;
    setTitle(value);
    scheduleSave({title:value});
  }

  function handleContentInput(){
    if(!editorRef.current) return;
    scheduleSave({content: editorRef.current.innerHTML});
  }

  function exec(cmd, value){
    if(editorRef.current) editorRef.current.focus();
    document.execCommand(cmd, false, value);
    handleContentInput();
  }

  function preventBlur(e){ e.preventDefault(); }

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <input
        className="note-title-input"
        value={title}
        placeholder="Untitled note"
        onChange={handleTitleChange}
      />
      <div className="note-toolbar">
        <div className="note-toolbar-group">
          <select onMouseDown={preventBlur} onChange={e=>exec('formatBlock', e.target.value)} defaultValue="P" title="Paragraph style">
            <option value="P">Normal text</option>
            <option value="H1">Heading 1</option>
            <option value="H2">Heading 2</option>
            <option value="BLOCKQUOTE">Quote</option>
          </select>
        </div>
        <div className="note-toolbar-group">
          <select onMouseDown={preventBlur} onChange={e=>exec('fontName', e.target.value)} defaultValue="Inter" title="Font">
            {FONT_OPTIONS.map(([value,label])=>(
              <option key={value} value={value} style={{fontFamily:`'${value}'`}}>{label}</option>
            ))}
          </select>
        </div>
        <div className="note-toolbar-group">
          <select onMouseDown={preventBlur} onChange={e=>exec('fontSize', e.target.value)} defaultValue="3" title="Font size">
            {SIZE_OPTIONS.map(([value,label])=>(<option key={value} value={value}>{label}</option>))}
          </select>
        </div>
        <div className="note-toolbar-group">
          <button onMouseDown={e=>{preventBlur(e); exec('bold');}} title="Bold" style={{fontFamily:'serif'}}><b>B</b></button>
          <button onMouseDown={e=>{preventBlur(e); exec('italic');}} title="Italic" style={{fontStyle:'italic',fontFamily:'serif'}}>I</button>
          <button onMouseDown={e=>{preventBlur(e); exec('underline');}} title="Underline" style={{textDecoration:'underline',fontFamily:'serif'}}>U</button>
          <button onMouseDown={e=>{preventBlur(e); exec('strikeThrough');}} title="Strikethrough" style={{textDecoration:'line-through',fontFamily:'serif'}}>S</button>
        </div>
        <div className="note-toolbar-group">
          <button onMouseDown={e=>{preventBlur(e); exec('justifyLeft');}} title="Align left">⯇</button>
          <button onMouseDown={e=>{preventBlur(e); exec('justifyCenter');}} title="Align center">≡</button>
          <button onMouseDown={e=>{preventBlur(e); exec('justifyRight');}} title="Align right">⯈</button>
        </div>
        <div className="note-toolbar-group">
          <button onMouseDown={e=>{preventBlur(e); exec('insertUnorderedList');}} title="Bullet list">•≡</button>
        </div>
        <div className="note-toolbar-group">
          <input type="color" defaultValue="#1B2333" title="Text color" onMouseDown={preventBlur} onChange={e=>exec('foreColor', e.target.value)}/>
        </div>
      </div>
      <div
        ref={editorRef}
        className="note-editor-area"
        contentEditable
        suppressContentEditableWarning={true}
        onInput={handleContentInput}
      />
    </div>
  );
}

function UploadModal({onClose,onUpload,uploading,backendOnline}){
  const [file,setFile] = useState(null);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Upload Object to NSRH HUB</h3>
        <p>Select any file from your device. Real bytes are sent to the local Python backend, which independently verifies the SHA-256 checksum before saving to disk.</p>
        {!backendOnline && !uploading && (
          <p style={{marginTop:-8,marginBottom:14,color:'var(--bad)',fontWeight:600,fontSize:12}}>⚠ Local backend is offline. Start server.py (or double-click start_nsrh.bat) and try again.</p>
        )}
        <div className="field">
          <label>Choose File</label>
          <input type="file" onChange={e=>setFile(e.target.files[0]||null)} disabled={!!uploading}/>
        </div>
        {file && !uploading && (
          <p style={{marginTop:-6,color:'var(--brand)',fontWeight:500}}>{file.name} · {(file.size/1024).toFixed(1)} KB</p>
        )}
        {uploading && (
          <div>
            <div className="progress-outer"><div className="progress-inner" style={{width:uploading.progress+'%'}}></div></div>
            <p style={{margin:0,fontSize:12,color:'var(--dim)'}}>{uploading.phase}</p>
          </div>
        )}
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose} disabled={!!uploading}>Cancel</button>
          <button className="btn btn-brand" disabled={!file || !!uploading || !backendOnline} onClick={()=>onUpload(file)}><Icon name="upload"/>Upload</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
